# $HOME/.k9s/plugin.yml
# move selected line to chosen resource in K9s, then:
# Shift-T (with confirmation) to toggle helm releases or kustomizations suspend and resume
# Shift-R (no confirmation) to reconcile a git source or a helm release or a kustomization
# Shift-D (prompts for a path) to diff a kustomization against local manifests
# Shift-E (prompts for dump and compact options) to show the resources a kustomization manages
plugins:
  toggle-helmrelease:
    shortCut: Shift-T
    confirm: true
    scopes:
      - helmreleases
    description: Toggle to suspend or resume a HelmRelease
    command: bash
    background: false
    args:
      - -c
      - >-
        suspended=$(kubectl --context $CONTEXT get helmreleases -n $NAMESPACE $NAME -o=custom-columns=TYPE:.spec.suspend | tail -1);
        verb=$([ $suspended = "true" ] && echo "resume" || echo "suspend");
        flux
        $verb helmrelease
        --context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  toggle-kustomization:
    shortCut: Shift-T
    confirm: true
    scopes:
      - kustomizations
    description: Toggle to suspend or resume a Kustomization
    command: bash
    background: false
    args:
      - -c
      - >-
        suspended=$(kubectl --context $CONTEXT get kustomizations -n $NAMESPACE $NAME -o=custom-columns=TYPE:.spec.suspend | tail -1);
        verb=$([ $suspended = "true" ] && echo "resume" || echo "suspend");
        flux
        $verb kustomization
        --context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  reconcile-git:
    shortCut: Shift-R
    confirm: false
    description: Flux reconcile
    scopes:
      - gitrepositories
    command: bash
    background: false
    args:
      - -c
      - >-
        flux
        reconcile source git
        --context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  reconcile-hr:
    shortCut: Shift-R
    confirm: false
    description: Flux reconcile
    scopes:
      - helmreleases
    command: bash
    background: false
    inputs:
      - name: force
        label: Force install/upgrade
        type: bool
        default: false
      - name: reset
        label: Reset failure count
        type: bool
        default: false
      - name: source
        label: Reconcile source as well
        type: bool
        default: false
    args:
      - -c
      - >-
        flux
        reconcile helmrelease
        --context $CONTEXT
        -n $NAMESPACE $NAME
        $([ "$INPUT_FORCE" = "true" ] && echo "--force")
        $([ "$INPUT_RESET" = "true" ] && echo "--reset")
        $([ "$INPUT_SOURCE" = "true" ] && echo "--with-source")
        | less -K
  reconcile-helm-repo:
    shortCut: Shift-Z
    description: Flux reconcile
    scopes:
      - helmrepositories
    command: bash
    background: false
    confirm: false
    args:
      - -c
      - >-
        flux
        reconcile source helm
        --context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  reconcile-oci-repo:
    shortCut: Shift-Z
    description: Flux reconcile
    scopes:
      - ocirepositories
    command: bash
    background: false
    confirm: false
    args:
      - -c
      - >-
        flux
        reconcile source oci
        --context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  reconcile-ks:
    shortCut: Shift-R
    confirm: false
    description: Flux reconcile
    scopes:
      - kustomizations
    command: bash
    background: false
    inputs:
      - name: source
        label: Reconcile source as well
        type: bool
        default: false
    args:
      - -c
      - >-
        flux
        reconcile kustomization
        --context $CONTEXT
        -n $NAMESPACE $NAME
        $([ "$INPUT_SOURCE" = "true" ] && echo "--with-source")
        | less -K
  diff-kustomization:
    shortCut: Shift-D
    confirm: false
    description: Diff against a local path
    scopes:
      - kustomizations
    command: bash
    background: false
    inputs:
      - name: path
        label: Local path
        type: path
        required: true
        default: .
    args:
      - -c
      - >-
        flux
        diff kustomization
        --context $CONTEXT
        -n $NAMESPACE $NAME
        --path $INPUT_PATH
        | less -K
  tree-kustomization:
    shortCut: Shift-E
    confirm: false
    description: Show resources managed by a Kustomization
    scopes:
      - kustomizations
    command: bash
    background: false
    inputs:
      - name: compact
        label: Flux resources only (optional)
        type: bool
        default: false
      - name: dump_path
        label: Dump directory (optional)
        type: path
      - name: show_managed_fields
        label: Show managed fields (optional)
        type: bool
        default: false
    args:
      - -c
      - >-
        dump_path="$INPUT_DUMP_PATH";
        show_managed_fields="$INPUT_SHOW_MANAGED_FIELDS";
        compact="$INPUT_COMPACT";
        show_error() { echo "$1" | less -K; };
        if [ "$show_managed_fields" = "true" ] && [ -z "$dump_path" ]; then
          show_error "A dump path is required when showing managed fields";
          exit 1;
        fi;
        if [ -n "$dump_path" ]; then
          case "$dump_path" in
            "~") dump_path="$HOME" ;;
            "~/"*) dump_path="$HOME/${dump_path#~/}" ;;
          esac;
          mkdir -p "$dump_path" || { show_error "Failed to create dump directory: $dump_path"; exit 1; };
          dump_path=$(cd "$dump_path" && pwd -P) || { show_error "Failed to resolve dump directory: $dump_path"; exit 1; };
          output_file="$dump_path/$NAME.yaml";
          if [ -e "$output_file" ]; then
            show_error "Refusing to overwrite $output_file: this file may contain valuable information; delete it before retrying";
            exit 1;
          fi;
          tmp_output_file="${output_file}.tmp";
          rm -f "$tmp_output_file";
          dump_args=(tree kustomization "$NAME" --context "$CONTEXT" -n "$NAMESPACE");
          if [ "$compact" = "true" ]; then dump_args+=(--compact); fi;
          if [ "$show_managed_fields" = "true" ]; then dump_args+=(--show-managed-fields); fi;
          dump_args+=(-o full);
          if flux "${dump_args[@]}" > "$tmp_output_file"; then
            if [ -s "$tmp_output_file" ]; then
              timestamp_output_file="${output_file}.timestamped";
              { echo "# Generated at $(date '+%Y-%m-%d %H:%M:%S %Z')"; cat "$tmp_output_file"; } > "$timestamp_output_file" &&
                mv "$timestamp_output_file" "$output_file" ||
                { show_error "Failed to timestamp Flux tree dump: $output_file"; rm -f "$timestamp_output_file" "$output_file"; };
              rm -f "$tmp_output_file";
            else
              show_error "Flux tree produced no output";
              rm -f "$tmp_output_file";
            fi;
          else
            show_error "Failed to create Flux tree dump: $output_file";
            rm -f "$tmp_output_file";
          fi;
        fi;
        view_args=(tree kustomization --context "$CONTEXT" -n "$NAMESPACE" "$NAME");
        if [ "$compact" = "true" ]; then view_args+=(--compact); fi;
        if [ "$show_managed_fields" = "true" ]; then view_args+=(--show-managed-fields); fi;
        flux "${view_args[@]}" | less -K;
        if [ -n "$dump_path" ]; then
          echo "Dump directory: $dump_path";
          echo "Dump file: $dump_path/$NAME.yaml";
        fi
  reconcile-ir:
    shortCut: Shift-R
    confirm: false
    description: Flux reconcile
    scopes:
      - imagerepositories
    command: sh
    background: false
    args:
      - -c
      - >-
        flux
        reconcile image repository
        --context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  reconcile-iua:
    shortCut: Shift-R
    confirm: false
    description: Flux reconcile
    scopes:
      - imageupdateautomations
    command: sh
    background: false
    args:
      - -c
      - >-
        flux
        reconcile image update
        --context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  toggle-rset:
    shortCut: Shift-T
    confirm: false
    scopes:
      - resourcesets
    description: Toggle to suspend or resume a ResourceSet
    command: bash
    background: false
    args:
      - -c
      - >-
        reconcile=$(kubectl --context $CONTEXT get resourceset -n $NAMESPACE $NAME -o=custom-columns='TYPE:.metadata.annotations.fluxcd\.controlplane\.io/reconcile' | tail -1);
        verb=$([ $reconcile = "disabled" ] && echo "resume" || echo "suspend");
        flux-operator
        $verb rset
        --kube-context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  toggle-inputprovider:
    shortCut: Shift-T
    confirm: false
    scopes:
      - resourcesetinputprovider
    description: Toggle to suspend or resume an InputProvider
    command: bash
    background: false
    args:
      - -c
      - >-
        reconcile=$(kubectl --context $CONTEXT get resourcesetinputprovider -n $NAMESPACE $NAME -o=custom-columns='TYPE:.metadata.annotations.fluxcd\.controlplane\.io/reconcile' | tail -1);
        verb=$([ $reconcile = "disabled" ] && echo "resume" || echo "suspend");
        flux-operator
        $verb inputprovider
        --kube-context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  reconcile-rset:
    shortCut: Shift-R
    confirm: false
    description: Flux reconcile
    scopes:
      - resourcesets
    command: bash
    background: false
    args:
      - -c
      - >-
        flux-operator
        reconcile rset
        --kube-context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  reconcile-inputprovider:
    shortCut: Shift-R
    confirm: false
    description: Flux reconcile
    scopes:
      - resources
    command: bash
    background: false
    args:
      - -c
      - >-
        flux-operator
        reconcile inputprovider
        --kube-context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  reconcile-fluxinstance:
    shortCut: Shift-R
    confirm: false
    description: Flux reconcile
    scopes:
      - fluxinstances
    command: bash
    background: false
    args:
      - -c
      - >-
        flux-operator
        reconcile instance
        --kube-context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  toggle-fluxinstance:
    shortCut: Shift-T
    confirm: false
    scopes:
      - fluxinstances
    description: Toggle to suspend or resume a FluxInstance
    command: bash
    background: false
    args:
      - -c
      - >-
        reconcile=$(kubectl --context $CONTEXT get fluxinstance -n $NAMESPACE $NAME -o=custom-columns='TYPE:.metadata.annotations.fluxcd\.controlplane\.io/reconcile' | tail -1);
        verb=$([ $reconcile = "disabled" ] && echo "resume" || echo "suspend");
        flux-operator
        $verb instance
        --kube-context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  trace:
    shortCut: Shift-Q
    confirm: false
    description: Flux trace
    scopes:
      - all
    command: bash
    background: false
    args:
      - -c
      - >-
        if [ -n "$RESOURCE_GROUP" ]; then api_endpoint="/apis/$RESOURCE_GROUP/$RESOURCE_VERSION"; else api_endpoint="/api/$RESOURCE_VERSION"; fi;
        api_resource=$(kubectl get --raw "${api_endpoint}" | jq -r ".resources[] | select(.name==\"$RESOURCE_NAME\")");
        kind=$(echo ${api_resource} | jq -r '.kind');
        namespace_arg=$(echo ${api_resource} | jq -r "if .namespaced == true then \"--namespace $NAMESPACE\" else \"\" end");
        [ -n "$RESOURCE_GROUP" ] && api_version=$RESOURCE_GROUP/;
        api_version=${api_version}$RESOURCE_VERSION;
        flux
        trace
        --context $CONTEXT
        --kind ${kind}
        --api-version ${api_version}
        ${namespace_arg}
        $NAME
        |& less -K
  # credits: https://github.com/fluxcd/flux2/discussions/2494
  get-suspended-helmreleases:
    shortCut: Shift-S
    override: true
    confirm: false
    description: Suspended Helm Releases
    scopes:
      - helmrelease
    command: sh
    background: false
    args:
      - -c
      - >-
        kubectl get
        --context $CONTEXT
        --all-namespaces
        helmreleases.helm.toolkit.fluxcd.io -o json
        | jq -r '.items[] | select(.spec.suspend==true) | [.metadata.namespace,.metadata.name,.spec.suspend] | @tsv'
        | less -K
  get-suspended-kustomizations:
    shortCut: Shift-S
    override: true
    confirm: false
    description: Suspended Kustomizations
    scopes:
      - kustomizations
    command: sh
    background: false
    args:
      - -c
      - >-
        kubectl get
        --context $CONTEXT
        --all-namespaces
        kustomizations.kustomize.toolkit.fluxcd.io -o json
        | jq -r '.items[] | select(.spec.suspend==true) | [.metadata.name,.spec.suspend] | @tsv'
        | less -K
